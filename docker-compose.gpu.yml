# GPU overlay. Requires the NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# The backend image installs the default PyPI torch wheel, which on Linux
# already bundles CUDA, so only device access has to be granted.

services:
  backend:
    environment:
      AI_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
